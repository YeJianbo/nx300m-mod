# Avoid native filesystem enumeration hanging on unavailable mounted volumes.
# Gradle still checks source changes at each build; only continuous watching is off.
org.gradle.vfs.watch=false

# Unify the Gradle daemon JVM args. Without this, Android Studio (2048m default),
# command-line ./gradlew (512m default) and IDE builds each spawn their own daemon,
# leaving several multi-GB daemons resident at once.
org.gradle.jvmargs=-XX:MaxMetaspaceSize=1024m -Xmx3072m
