[package]
name = "nx-quickshare"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[dependencies]
anyhow = "1"
rqs_lib = { path = "core", default-features = false }
serde_json = "1"
tokio = { version = "1.43", features = ["macros", "rt", "net", "sync", "time", "io-util", "io-std", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "s"
codegen-units = 1
strip = true
